services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grpc
      POSTGRES_PASSWORD: grpc
      POSTGRES_DB: grpcpoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
