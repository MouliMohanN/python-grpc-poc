syntax = "proto3";

package notes;

option go_package = "github.com/moulimohann/grpc-poc/go-server/gen/notes";

service NotesService {
  rpc CreateNote    (CreateNoteRequest)    returns (CreateNoteResponse);
  rpc GetNote       (GetNoteRequest)       returns (Note);
  rpc StreamNotes   (StreamNotesRequest)   returns (stream Note);
  rpc DeleteAllNotes(DeleteAllNotesRequest) returns (DeleteAllNotesResponse);
}

message Note {
  string id    = 1;
  string title = 2;
  string body  = 3;
}

message CreateNoteRequest {
  string title = 1;
  string body  = 2;
}

message CreateNoteResponse {
  string id = 1;
}

message GetNoteRequest {
  string id = 1;
}

message StreamNotesRequest {}

message DeleteAllNotesRequest {}

message DeleteAllNotesResponse {
  int32 deleted = 1;
}
